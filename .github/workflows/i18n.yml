name: Atualizar template de traduções

on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'public/locales/en/**'
      - 'i18next.config.ts'
      - 'package.json'
      - '.github/workflows/i18n.yml'
  workflow_dispatch:

concurrency:
  group: i18n-template
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  template:
    name: Extrair chaves do i18next
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Extrair chaves para o template en
        run: pnpm i18n:extract

      - name: Abrir ou atualizar o PR do template
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: i18n/template
          base: develop
          add-paths: public/locales/**
          commit-message: 'chore(i18n): atualiza o template en com as chaves novas do código'
          title: 'chore(i18n): atualiza o template en com as chaves novas do código'
          body: |
            Chaves extraídas do código por `pnpm i18n:extract` depois do último push no `develop`.

            Depois do merge, o Weblate passa a mostrar os textos novos para tradução.
          delete-branch: true

      - name: Rodar os testes no PR do template
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref i18n/template -R ${{ github.repository }}
