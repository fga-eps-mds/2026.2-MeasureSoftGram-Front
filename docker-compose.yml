services:
  front:
    container_name: front
    build:
      context: .
      args:
        NEXT_PUBLIC_LOGIN_REDIRECT_URL: ${NEXT_PUBLIC_LOGIN_REDIRECT_URL:-}
        NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID:-}
        GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
    restart: on-failure
    ports:
      - '3000:3000'
    volumes:
      - .:/usr/src/
      - /usr/src/node_modules
      - /usr/src/.next
    env_file:
      - .env
    environment:
      # lida em execucao pelo servidor do Next (proxy.ts e /bff); nao e mais fixada no build
      SERVICE_URL: ${SERVICE_URL:-http://service:8080/api}
    extra_hosts:
      - "host.docker.internal:host-gateway"
